name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# npm ci runs dependency lifecycle scripts; keep the token read-only.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
